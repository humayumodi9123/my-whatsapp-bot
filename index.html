<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Sender Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f0f2f5; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 250px; background-color: #ffffff; height: 100%; box-shadow: 2px 0 5px rgba(0,0,0,0.1); position: fixed; left: -250px; transition: 0.3s; z-index: 1000; padding-top: 60px; }
        .sidebar.active { left: 0; }
        .sidebar-btn { display: block; width: 100%; padding: 15px 20px; text-align: left; background: none; border: none; font-size: 16px; font-weight: bold; color: #333; cursor: pointer; border-bottom: 1px solid #eee; transition: 0.2s; }
        .sidebar-btn:hover, .sidebar-btn.active { background-color: #e0f2f1; color: #075e54; }
        .topbar { width: 100%; background-color: #075e54; color: white; padding: 15px 20px; display: flex; align-items: center; position: fixed; top: 0; left: 0; z-index: 1001; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .menu-toggle { font-size: 24px; cursor: pointer; background: none; border: none; color: white; margin-right: 20px; }
        .topbar h2 { margin: 0; font-size: 20px; }
        .main-content { margin-top: 60px; padding: 30px; width: 100%; transition: 0.3s; overflow-y: auto; }
        .content-section { display: none; max-width: 800px; margin: 0 auto; background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .content-section.active { display: block; }
        .stats-container { display: flex; gap: 20px; margin-bottom: 30px; }
        .stat-card { flex: 1; background: #e8f5e9; padding: 20px; border-radius: 8px; text-align: center; border-left: 5px solid #25d366; }
        .stat-card h3 { margin: 0 0 10px 0; color: #555; font-size: 16px; }
        .stat-card .number { font-size: 32px; font-weight: bold; color: #333; }
        h2.section-title { color: #075e54; text-align: center; margin-top: 0; margin-bottom: 25px; }
        .qr-section { text-align: center; padding: 20px; background-color: #f9f9f9; border: 2px dashed #ccc; border-radius: 10px; }
        .qr-placeholder { width: 200px; height: 200px; background-color: #e0e0e0; display: flex; align-items: center; justify-content: center; margin: 0 auto; color: #666; font-weight:bold; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #333; }
        textarea, input[type="file"], input[type="text"], input[type="number"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-family: Arial, sans-serif; }
        textarea { resize: vertical; height: 100px; }
        .action-btn { background-color: #25d366; color: white; border: none; padding: 14px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold; transition: background 0.3s; }
        .action-btn:hover { background-color: #1ebe5d; }
        .action-btn:disabled { background-color: #9cdbaf; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="topbar">
        <button class="menu-toggle" onclick="toggleSidebar()">&#9776;</button>
        <h2>WhatsApp Tool</h2>
    </div>

    <div class="sidebar" id="sidebar">
        <button class="sidebar-btn active" onclick="showSection('dashboard', this)">1. Dashboard</button>
        <button class="sidebar-btn" onclick="showSection('sendMsg', this)">2. Send Message & Photo</button>
        <button class="sidebar-btn" onclick="showSection('connectWp', this)">3. Connect WhatsApp</button>
    </div>

    <div class="main-content" id="mainContent">
        <div id="dashboard" class="content-section active">
            <h2 class="section-title">Dashboard</h2>
            <div class="stats-container">
                <div class="stat-card">
                    <h3>Messages Sent (Today)</h3>
                    <div class="number" id="sentCount">0</div>
                </div>
            </div>
        </div>

        <div id="sendMsg" class="content-section">
            <h2 class="section-title">Send Message & Photo</h2>
            <div class="form-group">
                <label>मोबाइल नंबर (एक लाइन में एक):</label>
                <textarea id="numbers" placeholder="919876543210&#10;919123456789"></textarea>
            </div>
            <div class="form-group">
                <label>फ़ोटो / पोस्टर (ऑप्शनल):</label>
                <input type="file" id="imageFile" accept="image/*">
            </div>
            <div class="form-group">
                <label>संदेश (Message / Caption):</label>
                <textarea id="message" placeholder="यहाँ अपना मैसेज लिखें..."></textarea>
            </div>
            <div class="form-group">
                <label>मैसेज के बीच का समय (सेकंड में):</label>
                <input type="number" id="delay" value="3" min="1" max="60">
            </div>
            <button class="action-btn" id="sendBtn" onclick="startSending()" disabled>संदेश भेजना शुरू करें (QR कनेक्ट करें)</button>
        </div>

        <div id="connectWp" class="content-section">
            <h2 class="section-title">Connect WhatsApp</h2>
            <div class="qr-section">
                <div class="qr-placeholder" id="qrPlaceholder">Connecting to Backend...</div>
                <img id="realQr" src="" style="display:none; max-width:250px; margin: 0 auto;">
                <div style="margin-top: 15px; font-weight: bold; color: #d9534f;" id="connectionStatus">Status: Not Connected</div>
                
                <hr style="margin: 25px 0; border: 0; border-top: 1px dashed #ccc;">
                
                <h3 style="color: #333; font-size: 16px; margin-bottom: 15px;">या बिना दूसरे फ़ोन के नंबर से लिंक करें (Pairing Code)</h3>
                <div class="form-group" style="margin-bottom: 10px;">
                    <input type="text" id="pairPhone" placeholder="अपना WhatsApp नंबर डालें (जैसे 9876543210)" style="text-align: center;">
                </div>
                <button class="action-btn" style="background-color: #128C7E;" id="pairBtn" onclick="getPairingCode()">8-Digit कोड प्राप्त करें</button>
                
                <div id="pairingCodeDisplay" style="display:none; margin-top:20px; font-size:28px; font-weight:bold; letter-spacing: 8px; color: #075e54; background: #e8f5e9; padding: 15px; border-radius: 8px; border: 2px dashed #25d366;">
                    --------
                </div>
                <p id="pairInstruction" style="display:none; color:#666; font-size:14px; margin-top:10px;">
                    अपने WhatsApp में <b>Linked Devices</b> -> <b>Link with phone number instead</b> पर जाएँ और यह कोड डालें।
                </p>
            </div>
        </div>
    </div>

    <script>
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('active'); }
        function showSection(sectionId, btnElement) {
            document.querySelectorAll('.content-section').forEach(sec => sec.classList.remove('active'));
            document.getElementById(sectionId).classList.add('active');
            document.querySelectorAll('.sidebar-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            if (window.innerWidth < 768) toggleSidebar();
        }

        let checkInterval;
        function checkBackendStatus() {
            fetch('/status')
                .then(res => res.json())
                .then(data => {
                    const statusText = document.getElementById('connectionStatus');
                    const qrPlaceholder = document.getElementById('qrPlaceholder');
                    const realQr = document.getElementById('realQr');
                    const sendBtn = document.getElementById('sendBtn');

                    if (data.connected) {
                        statusText.innerText = "Status: WhatsApp Connected ✅";
                        statusText.style.color = "green";
                        qrPlaceholder.style.display = "flex";
                        qrPlaceholder.innerText = "WhatsApp Connected!";
                        qrPlaceholder.style.backgroundColor = "#c8e6c9";
                        realQr.style.display = "none";
                        sendBtn.disabled = false;
                        sendBtn.innerText = "संदेश भेजना शुरू करें";
                        
                        // कोड वाले बॉक्स को भी छुपा दें
                        document.getElementById('pairingCodeDisplay').style.display = 'none';
                        document.getElementById('pairInstruction').style.display = 'none';
                        document.getElementById('pairBtn').style.display = 'none';
                        document.getElementById('pairPhone').style.display = 'none';

                        clearInterval(checkInterval);
                    } else if (data.qrCode) {
                        statusText.innerText = "Status: Waiting for Scan or Code...";
                        statusText.style.color = "#ff9800";
                        qrPlaceholder.style.display = "none";
                        realQr.src = data.qrCode;
                        realQr.style.display = "block";
                    }
                })
                .catch(err => {
                    document.getElementById('connectionStatus').innerText = "Status: Server is Offline ❌";
                });
        }

        window.onload = () => {
            checkBackendStatus();
            checkInterval = setInterval(checkBackendStatus, 3000);
        };

        // नया फीचर: Pairing Code मंगाना
        function getPairingCode() {
            const phone = document.getElementById('pairPhone').value.trim();
            if(!phone) {
                alert('कृपया अपना WhatsApp नंबर दर्ज करें!');
                return;
            }

            const btn = document.getElementById('pairBtn');
            btn.innerText = "कोड जनरेट हो रहा है...";
            btn.disabled = true;

            fetch('/pair-code', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone: phone })
            })
            .then(res => res.json())
            .then(data => {
                btn.innerText = "8-Digit कोड प्राप्त करें";
                btn.disabled = false;
                
                if(data.success) {
                    document.getElementById('pairingCodeDisplay').style.display = 'block';
                    document.getElementById('pairInstruction').style.display = 'block';
                    document.getElementById('pairingCodeDisplay').innerText = data.code;
                } else {
                    alert('❌ Error: ' + data.error);
                }
            })
            .catch(err => {
                alert('सर्वर से संपर्क टूट गया है!');
                btn.innerText = "8-Digit कोड प्राप्त करें";
                btn.disabled = false;
            });
        }

        // फ़ोटो अपलोड सेटिंग
        let imageBase64 = null;
        document.getElementById('imageFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    imageBase64 = event.target.result;
                };
                reader.readAsDataURL(file);
            } else {
                imageBase64 = null;
            }
        });

        function startSending() {
            const rawNumbers = document.getElementById('numbers').value.trim();
            const message = document.getElementById('message').value.trim();
            const delay = parseInt(document.getElementById('delay').value) || 3;
            
            if (!rawNumbers || (!message && !imageBase64)) {
                alert('कृपया नंबर और मैसेज (या फ़ोटो) दर्ज करें!');
                return;
            }

            const numbers = rawNumbers.split(/[\n,]+/).map(num => num.trim()).filter(num => num.length > 0);
            const sendBtn = document.getElementById('sendBtn');
            sendBtn.disabled = true;
            sendBtn.innerText = "संदेश भेजे जा रहे हैं...";

            fetch('/send', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ numbers: numbers, message: message, delay: delay, imageBase64: imageBase64 })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    alert(`✅ प्रोसेस पूरी हुई!\nसफलता: ${data.sent}\nफेल: ${data.failed}`);
                    document.getElementById('sentCount').innerText = parseInt(document.getElementById('sentCount').innerText) + data.sent;
                } else {
                    alert('❌ Error: ' + data.error);
                }
                sendBtn.disabled = false;
                sendBtn.innerText = "संदेश भेजना शुरू करें";
            })
            .catch(err => {
                alert('सर्वर से संपर्क टूट गया है!');
                sendBtn.disabled = false;
                sendBtn.innerText = "संदेश भेजना शुरू करें";
            });
        }
    </script>
</body>
</html>
