<!DOCTYPE html>
<html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>WhatsApp Marketing Pro</title><style>
body{font-family:sans-serif;background:#f4f7f6;margin:0;display:flex;height:100vh;overflow:hidden}.sidebar{width:250px;background:#fff;height:100%;position:fixed;left:-250px;transition:.3s;padding-top:60px;border-right:1px solid #eaeaea;z-index:1000}.sidebar.active{left:0}.sidebar-btn{display:block;width:100%;padding:16px 20px;text-align:left;background:none;border:none;font-weight:600;color:#4a5568;cursor:pointer}.topbar{width:100%;background:#075e54;color:#fff;padding:15px;display:flex;align-items:center;position:fixed;top:0;z-index:1001}.main-content{margin-top:60px;padding:20px;width:100%;overflow-y:auto}.content-section{display:none;background:#fff;padding:20px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.05)}.content-section.active{display:block}.stat-card{background:#f8fff9;padding:20px;border-radius:10px;margin-bottom:15px;text-align:center;border-left:5px solid #25d366}.number{font-size:30px;font-weight:bold}.action-btn{width:100%;padding:15px;background:#25d366;color:#fff;border:none;border-radius:8px;font-weight:bold;cursor:pointer}.form-group{margin-bottom: 15px;}label{font-weight: bold; color:#333; font-size:14px; display:block; margin-bottom:5px;}input[type="number"]{width:100%; padding:10px; border:1px solid #ccc; border-radius:5px; box-sizing:border-box;}
</style></head><body>
<div class="topbar"><button onclick="document.getElementById('sidebar').classList.toggle('active')" style="background:none;border:none;color:white;font-size:24px;cursor:pointer;">&#9776;</button><h2 style="margin-left:15px; margin-top:0; margin-bottom:0;">WhatsApp Pro</h2></div>
<div class="sidebar" id="sidebar">
<button class="sidebar-btn" onclick="showSection('dashboard')">📊 Dashboard</button>
<button class="sidebar-btn" onclick="showSection('sendMsg')">📨 Send Message</button>
<button class="sidebar-btn" onclick="showSection('autoReply')">🤖 Auto-Reply</button>
<button class="sidebar-btn" onclick="showSection('connectWp')">🔗 WhatsApp</button>
</div>
<div class="main-content">
<div id="dashboard" class="content-section active">
<h2>Analytics</h2>
<input type="date" id="dateFilter" onchange="fetchStats()" style="padding:10px; border-radius:5px; border:1px solid #ccc; margin-bottom:15px; width:100%; box-sizing:border-box;">
<div class="stat-card"><h3>Sent</h3><div class="number" id="sentCount" style="color:green;">0</div></div>
<div class="stat-card" style="border-left-color:red"><h3>Failed</h3><div class="number" id="failedCount" style="color:red;">0</div></div>
</div>
<div id="sendMsg" class="content-section">
<h2>Send Message</h2>
<div class="form-group">
<textarea id="numbers" placeholder="Mobile Numbers (One per line)..." style="width:100%;height:100px;padding:10px;border:1px solid #ccc;border-radius:5px;box-sizing:border-box;"></textarea>
</div>
<div class="form-group"><input type="file" id="imageFile"></div>
<div class="form-group">
<textarea id="message" placeholder="Message / Caption..." style="width:100%;height:100px;padding:10px;border:1px solid #ccc;border-radius:5px;box-sizing:border-box;"></textarea>
</div>

<!-- नया रैंडम टाइमर सेटिंग्स -->
<div style="display: flex; gap: 10px; margin-bottom: 20px; background: #f9f9f9; padding: 15px; border-radius: 8px; border: 1px dashed #ccc;">
    <div style="flex: 1;">
        <label>कम से कम समय (Sec):</label>
        <input type="number" id="minDelay" value="15" min="5">
    </div>
    <div style="flex: 1;">
        <label>अधिकतम समय (Sec):</label>
        <input type="number" id="maxDelay" value="45" min="10">
    </div>
</div>

<button class="action-btn" id="sendBtn" onclick="startSending()">Send Message</button>
<p style="font-size: 12px; color: #666; text-align:center; margin-top:10px;">नोट: बॉट हर मैसेज के लिए इन दोनों के बीच का कोई रैंडम समय लेगा (Anti-Ban).</p>
</div>
<div id="autoReply" class="content-section">
<h2>Auto-Reply Setting</h2>
<div style="margin-bottom:15px;">
<input type="checkbox" id="autoReplyToggle" onchange="toggleAutoReply()" style="transform: scale(1.5); margin-right:10px;"> <label style="display:inline; font-size:18px;">Auto-Reply ON</label>
</div>
<textarea id="editAutoReplyMsg" style="width:100%;height:150px;padding:10px;border:1px solid #ccc;border-radius:5px;box-sizing:border-box;"></textarea>
<button class="action-btn" onclick="updateAutoReplyMsg()" style="margin-top:15px; background-color:#2b6cb0;">Update Msg</button>
</div>
<div id="connectWp" class="content-section" style="text-align:center;">
<h2>Connect WhatsApp</h2>
<img id="realQr" style="max-width:100%; margin:0 auto; border-radius:8px;">
<hr style="margin:20px 0;">
<div class="form-group">
<input type="text" id="pairPhone" placeholder="Enter WhatsApp Number" style="width:100%; padding:15px; text-align:center; font-size:18px; border:1px solid #ccc; border-radius:8px; box-sizing:border-box;">
</div>
<button class="action-btn" onclick="getPairingCode()" style="background-color:#2b6cb0;">Get 8-Digit Code</button>
<div id="pairingCodeDisplay" style="font-size:28px; font-weight:bold; color:#2b6cb0; text-align:center; margin-top:20px; letter-spacing:5px;"></div>
</div>
</div>
<script>
function showSection(id){document.querySelectorAll('.content-section').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active')}
function fetchStats(){fetch('/api/stats?date='+document.getElementById('dateFilter').value).then(r=>r.json()).then(d=>{document.getElementById('sentCount').innerText=d.sent;document.getElementById('failedCount').innerText=d.failed})}
function toggleAutoReply(){fetch('/toggle-autoreply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled:document.getElementById('autoReplyToggle').checked})})}
function updateAutoReplyMsg(){fetch('/update-autoreply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:document.getElementById('editAutoReplyMsg').value})}).then(()=>alert('✅ Message Updated Successfully!'))}
async function startSending(){const nums=document.getElementById('numbers').value.split('\n');const msg=document.getElementById('message').value;const img=document.getElementById('imageFile').files[0];let imgBase64=null;if(img){const reader=new FileReader();reader.onload=(e)=>{imgBase64=e.target.result;doSend(nums,msg,imgBase64)};reader.readAsDataURL(img)}else{doSend(nums,msg,null)}}
function doSend(nums,msg,img){
    const minD = document.getElementById('minDelay').value;
    const maxD = document.getElementById('maxDelay').value;
    if(parseInt(minD) >= parseInt(maxD)){ alert('एरर: अधिकतम समय (Max), कम से कम (Min) समय से ज़्यादा होना चाहिए!'); return; }
    
    fetch('/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({numbers:nums,message:msg,minDelay:minD,maxDelay:maxD,imageBase64:img})})
    .then(()=>alert('🚀 मैसेज भेजने की प्रक्रिया बैकग्राउंड में शुरू हो गई है! आप डैशबोर्ड में प्रोग्रेस देख सकते हैं।'))
}
function getPairingCode(){fetch('/pair-code',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:document.getElementById('pairPhone').value})}).then(r=>r.json()).then(d=>document.getElementById('pairingCodeDisplay').innerText=d.code)}
window.onload=()=>{fetchStats();setInterval(()=>{fetch('/status').then(r=>r.json()).then(d=>{if(d.qrCode)document.getElementById('realQr').src=d.qrCode;document.getElementById('autoReplyToggle').checked=d.autoReply;if(!document.getElementById('editAutoReplyMsg').value)document.getElementById('editAutoReplyMsg').value=d.currentMsg})},3000)}
</script></body></html>
